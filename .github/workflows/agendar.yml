name: Agendar Barbeiro

on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install

      - name: Agendar horário
        run: node book.js
        env:
          APPBARBER_AUTH:        ${{ secrets.APPBARBER_AUTH }}
          APPBARBER_CLIENT_ID:   ${{ secrets.APPBARBER_CLIENT_ID }}
          APPBARBER_DEVICE_ID:   ${{ secrets.APPBARBER_DEVICE_ID }}
          APPBARBER_CLIENT_CODE: ${{ secrets.APPBARBER_CLIENT_CODE }}
          RESEND_API_KEY:        ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL:       ${{ secrets.RECIPIENT_EMAIL }}
