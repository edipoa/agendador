name: Agendar Barbeiro

on:
  schedule:
    - cron: '0 21 * * 0'  # Todo domingo 21h UTC = 18h Brasília (BRT = UTC-3)
  workflow_dispatch:        # Permite rodar manualmente pela aba Actions no GitHub

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm install

      - name: Agendar horário
        run: node book.js
        env:
          APPBARBER_AUTH:        ${{ secrets.APPBARBER_AUTH }}
          APPBARBER_CLIENT_ID:   ${{ secrets.APPBARBER_CLIENT_ID }}
          APPBARBER_DEVICE_ID:   ${{ secrets.APPBARBER_DEVICE_ID }}
          APPBARBER_CLIENT_CODE: ${{ secrets.APPBARBER_CLIENT_CODE }}
          WHATSAPP_PHONE:        ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY:      ${{ secrets.CALLMEBOT_APIKEY }}
